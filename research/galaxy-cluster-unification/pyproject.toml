[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "void-screening-lab"
version = "0.1.0"
description = "Falsifiable SPARC tests of a smoothly screened, environment-dependent effective acceleration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "astropy>=7.0",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
kinematics = ["ppxf>=9.4.8,<10"]
satellites = ["scikit-learn>=1.7,<2"]
lensing = ["lenstronomy>=1.14.2,<2", "emcee>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
